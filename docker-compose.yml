services:
  db:
    image: timescale/timescaledb:latest-pg13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./db/postgresql:/var/lib/postgresql/data
  stats:
    build:
      context: ./back
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/MKCert_rootCA.crt
    volumes:
      - ./back:/app
      - ../development-edx/data/mkcert/rootCA.pem:/usr/local/share/ca-certificates/MKCert_rootCA.crt
    ports:
      - "8000:8000"
    depends_on:
      - db
  front:
    build:
      context: ./front
      target: dev
    command: npm start
    volumes:
      - ./front:/app
      - /app/node_modules
      #- ./logs:/root/.npm/_logs
    ports:
      - "3000:3000"

  # The Redis image will run on the sandbox network

networks:
  default:
    name: sandbox_default
    external: true
