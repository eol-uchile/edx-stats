name: Docker Image CI

on:
  push:
    paths:
      - 'front/**'
      - 'back/**'

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - uses: actions/checkout@v4

    - uses: dorny/paths-filter@v2.11.1
      id: filter
      with:
        filters: |
          backend:
            - 'back/**'
          frontend:
            - 'front/**'

  build-back:
    permissions:
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build --target prod ./back --tag ghcr.io/eol-uchile/edx-stats-back:${GITHUB_SHA}

    - name: Run tests
      run: docker run ghcr.io/eol-uchile/edx-stats-back:${GITHUB_SHA} python manage.py test

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to Github Container Registry
      if: github.ref == 'refs/heads/master'
      run: |
          docker push ghcr.io/eol-uchile/edx-stats-back:${GITHUB_SHA}

  build-front-staging:
    permissions:
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Pull submodules
      run: git submodule update --init --recursive

    - name: Build dev
      run: docker build --target dev ./front --tag ghcr.io/eol-uchile/edx-front-test
    
    - name: Run Tests
      run: docker run ghcr.io/eol-uchile/edx-front-test npm test

    - name: Build the Docker image
      run: docker build --build-arg env_file=.env.staging ./front --tag ghcr.io/eol-uchile/edx-stats-front-staging:${GITHUB_SHA}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to Github Container Registry
      run: |
        docker push ghcr.io/eol-uchile/edx-stats-front-staging:${GITHUB_SHA}

  build-front-eol:
    permissions:
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Pull submodules
      run: git submodule update --init --recursive

    - name: Build dev
      run: docker build --target dev ./front --tag ghcr.io/eol-uchile/edx-front-test
    
    - name: Run Tests
      run: docker run ghcr.io/eol-uchile/edx-front-test npm test

    - name: Build the Docker image
      run: docker build --build-arg env_file=.env.eol ./front --tag ghcr.io/eol-uchile/edx-stats-front-eol:${GITHUB_SHA}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to Github Container Registry
      run: |
        docker push ghcr.io/eol-uchile/edx-stats-front-eol:${GITHUB_SHA}
